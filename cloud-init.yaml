#cloud-config
# Reusable Orca ADE VPS baseline — NO SECRETS.
# Replace placeholders before launch:
#   - ssh_authorized_keys
#   Optional: write Tailscale auth key to /root/bootstrap-secrets/tailscale.key with 600 via a private channel AFTER boot,
#     or use Linode StackScript vars — do not commit keys.

hostname: orca-ade
manage_etc_hosts: true
timezone: Asia/Tokyo

users:
  - default
  - name: orca
    gecos: Orca ADE service
    shell: /usr/sbin/nologin
    lock_passwd: true
    create_home: true
    home: /home/orca
    # Orca terminals still run as this user with a bash rcfile.

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - gnupg
  - jq
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - direnv
  - build-essential
  - libssl-dev
  - libyaml-dev
  - zlib1g-dev
  - libreadline-dev
  - libffi-dev
  - libncurses-dev
  - xvfb
  - libfuse2t64
  - fuse3
  - python3

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      AllowTcpForwarding yes
      ClientAliveInterval 30
      ClientAliveCountMax 3

  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      backend = systemd
      maxretry = 3
      findtime = 10m
      bantime = 1h

      [recidive]
      enabled = true
      logpath = /var/log/fail2ban.log
      banaction = %(banaction_allports)s
      bantime = 1w
      findtime = 1d
      maxretry = 5

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /usr/local/share/orca-ade-stack/README.bootstrap
    permissions: "0644"
    content: |
      Post-boot: stack is at /root/orca-ade-stack (cloned from GitHub). Run:
        01-tailscale-and-lockdown.sh
        02-orca-serve.sh
        03-dev-toolchains.sh
      Do not put secrets in cloud-init.

  # Skeleton bashrc hooks for orca (toolchain install fills binaries later)
  - path: /root/orca-ade.bashrc.snippet
    permissions: "0644"
    content: |
      # Managed by orca-ade-stack — prepended by 03-dev-toolchains.sh
      export PATH="$HOME/.nodenv/bin:$HOME/.rbenv/bin:$HOME/.local/bin:$PATH"
      command -v nodenv >/dev/null && eval "$(nodenv init -)"
      command -v rbenv >/dev/null && eval "$(rbenv init -)"
      command -v direnv >/dev/null && eval "$(direnv hook bash)"

ssh_authorized_keys:
  - "REPLACE_WITH_YOUR_ED25519_PUBLIC_KEY"

runcmd:
  - |
    set -euo pipefail
    # Ensure root has the same pubkey (Linode also injects keys; this is belt-and-suspenders for generic clouds)
    mkdir -p /root/.ssh
    chmod 700 /root/.ssh
    if ! grep -q "REPLACE_WITH_YOUR_ED25519_PUBLIC_KEY" /root/.ssh/authorized_keys 2>/dev/null; then
      true
    fi
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades
  - |
    # Baseline UFW: allow SSH on public ONLY until Tailscale lockdown script runs
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow OpenSSH
    ufw --force enable
  - |
    # Install Tailscale package (join deferred — needs auth key)
    curl -fsSL https://tailscale.com/install.sh | sh
  - |
    # GitHub CLI (optional apt repo)
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
    apt-get update -qq && apt-get install -y gh || true
  - |
    # Google Cloud SDK apt (ADC login is manual later)
    echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" > /etc/apt/sources.list.d/google-cloud-sdk.list
    curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
    apt-get update -qq && apt-get install -y google-cloud-cli || true
  - mkdir -p /opt/orca /home/orca/workspaces /home/orca/.local/bin
  - chown -R orca:orca /home/orca
  - |
    if [ -f /root/orca-ade.bashrc.snippet ]; then
      install -o orca -g orca -m 0644 /root/orca-ade.bashrc.snippet /home/orca/.bashrc.orca-ade.snippet
    fi
  - |
    # CrowdSec (optional; safe to fail on older mirrors)
    apt-get install -y crowdsec crowdsec-firewall-bouncer || true
    systemctl enable --now crowdsec 2>/dev/null || true
    systemctl enable --now crowdsec-firewall-bouncer 2>/dev/null || true
  - |
    # Clone public stack (scripts/templates) — no secrets in repo
    rm -rf /root/orca-ade-stack
    git clone --depth 1 https://github.com/asakaxgit/orca-ade-stack.git /root/orca-ade-stack
    chmod +x /root/orca-ade-stack/scripts/*.sh /root/orca-ade-stack/linode-create.example.sh || true

final_message: |
  orca-ade-stack cloud-init finished. Stack cloned to /root/orca-ade-stack.
  Public SSH still open until:
    TAILSCALE_AUTH_KEY=... /root/orca-ade-stack/scripts/01-tailscale-and-lockdown.sh
  Then run 02-orca-serve.sh and 03-dev-toolchains.sh.
